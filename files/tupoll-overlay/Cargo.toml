[package]
name = "tupoll-overlay"
version = "0.1.0"
edition = "2024"

[dependencies]

[[bin]]
name = "pinnacle-install"
path = "src/bin/pinnacle-install.rs"

[[bin]]
name = "translator-config"
path = "src/bin/translator-config.rs"

[[bin]]
name = "pinnacle-terminal-config"
path = "src/bin/terminal-config.rs"

[[bin]]
name = "pinnacle-wallpaper-config"
path = "src/bin/wallpaper.rs"

[[bin]]
name = "pinnacle-notify-config"
path = "src/bin/notify.rs"

[[bin]]
name = "pinnacle-lock-config"
path = "src/bin/lock.rs"

[[bin]]
name = "pinnacle-screenshot-config"
path = "src/bin/screenshot.rs"

[[bin]]
name = "pinnacle-fm-config"
path = "src/bin/fm.rs"

[profile.release]
strip = true      
lto = true        
opt-level = "z" 
